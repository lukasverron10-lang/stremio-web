name: Native Windows shell and MPV installer

on:
  push:
    branches: [feature/cinema-immersive-windows]
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      webui_url:
        description: HTTPS URL of the deployed Stremio Web UI to load in the native shell
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WEBUI_URL: ${{ github.event.inputs.webui_url || 'https://stremio-cinema-preview-git-feature-cinema-5efd3f-platform-odyn.vercel.app/' }}
    steps:
      - name: Checkout redesigned Web UI
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Web UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile Web UI
        run: pnpm build
      - name: Run Web UI tests
        run: pnpm test --runInBand
      - name: Lint Web UI
        run: pnpm lint

      - name: Upload compiled redesigned Web UI
        uses: actions/upload-artifact@v4
        with:
          name: Stremio-Cinema-WebUI-build
          path: build/
          if-no-files-found: error
          retention-days: 14

      - name: Checkout official native WebView2 and MPV shell
        uses: actions/checkout@v4
        with:
          repository: Stremio/stremio-shell-ng
          ref: main
          path: native-shell

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure native shell to load the requested Web UI
        shell: pwsh
        run: |
          if ($env:WEBUI_URL -notmatch '^https://') { throw 'WEBUI_URL must be an HTTPS URL.' }
          $webHost = ([uri]$env:WEBUI_URL).Host
          if ([string]::IsNullOrWhiteSpace($webHost)) { throw 'WEBUI_URL must contain a valid hostname.' }
          "STREMIO_WEBUI_HOST=$webHost" | Out-File -FilePath $env:GITHUB_ENV -Append
          $constants = 'native-shell/src/stremio_app/constants.rs'
          $constantsSource = Get-Content $constants -Raw
          $hostAnchor = '    "web.stremio.com",'
          if (-not $constantsSource.Contains($hostAnchor)) { throw 'Could not locate native shell WebUI host allowlist.' }
          $constantsSource = $constantsSource.Replace($hostAnchor, $hostAnchor + [Environment]::NewLine + '    env!("STREMIO_WEBUI_HOST"),')
          Set-Content -Path $constants -Value $constantsSource -NoNewline
          $main = 'native-shell/src/main.rs'
          $source = Get-Content $main -Raw
          $old = '#[clap(long, default_value = WEB_ENDPOINT, help = "Override the WebUI URL")]'
          $new = '#[clap(long, default_value = env!("STREMIO_WEBUI_URL"), help = "Override the WebUI URL")]'
          if (-not $source.Contains($old)) { throw 'Could not locate the upstream WebUI URL argument; refusing an unsafe patch.' }
          $source = $source.Replace($old, $new)
          Set-Content -Path $main -Value $source -NoNewline
          "STREMIO_WEBUI_URL=$env:WEBUI_URL" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check native shell formatting
        working-directory: native-shell
        run: cargo fmt --all -- --check

      - name: Compile native shell with MPV
        working-directory: native-shell
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          STREMIO_WEBUI_URL: ${{ env.WEBUI_URL }}

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build native Windows installer
        shell: pwsh
        working-directory: native-shell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not installed.' }

          # The upstream script lists optional translations that are not shipped by every
          # Inno Setup package. Keep every language whose .isl file is actually installed.
          $scriptPath = 'setup\Stremio.iss'
          $script = [System.IO.File]::ReadAllText((Join-Path (Get-Location) $scriptPath))
          $compilerRoot = Split-Path $iscc -Parent
          $lines = $script -split "`r?`n"
          $inLanguages = $false
          $inCustomMessages = $false
          $keptLanguages = 0
          $unavailableLanguages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $filteredLines = foreach ($line in $lines) {
            if ($line -match '^\s*\[Languages\]\s*          if ($keptLanguages -lt 1) { throw 'No usable Inno Setup language definitions remain.' }
          $script = $filteredLines -join "`r`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $scriptPath), $script, [System.Text.UTF8Encoding]::new($false))

          & $iscc $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $installer = Get-ChildItem -Path . -Filter 'StremioSetup-v*_x64.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Native MPV installer was not produced at the expected output path.' }
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $signature = [System.IO.File]::ReadAllBytes($installer.FullName)[0..1]
          if ($signature[0] -ne 0x4D -or $signature[1] -ne 0x5A) { throw 'Installer does not have a valid Windows PE signature.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Run native shell tests
        working-directory: native-shell
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Upload native MPV installer
        uses: actions/upload-artifact@v4
        with:
          name: Stremio-Cinema-Native-Windows-x64
          path: native-shell/StremioSetup*.exe
          if-no-files-found: error
          retention-days: 14
) {
              $inLanguages = $true
              $inCustomMessages = $false
              $line
              continue
            }
            if ($line -match '^\s*\[CustomMessages\]\s*          if ($keptLanguages -lt 1) { throw 'No usable Inno Setup language definitions remain.' }
          $script = $filteredLines -join "`r`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $scriptPath), $script, [System.Text.UTF8Encoding]::new($false))

          & $iscc $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $installer = Get-ChildItem -Path . -Filter 'StremioSetup-v*_x64.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Native MPV installer was not produced at the expected output path.' }
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $signature = [System.IO.File]::ReadAllBytes($installer.FullName)[0..1]
          if ($signature[0] -ne 0x4D -or $signature[1] -ne 0x5A) { throw 'Installer does not have a valid Windows PE signature.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Run native shell tests
        working-directory: native-shell
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Upload native MPV installer
        uses: actions/upload-artifact@v4
        with:
          name: Stremio-Cinema-Native-Windows-x64
          path: native-shell/StremioSetup*.exe
          if-no-files-found: error
          retention-days: 14
) {
              $inLanguages = $false
              $inCustomMessages = $true
              $line
              continue
            }
            if ($line -match '^\s*\[') {
              $inLanguages = $false
              $inCustomMessages = $false
            }

            if ($inLanguages -and $line -match '^\s*Name:\s*"([^"]+)".*MessagesFile:\s*"compiler:([^"]+)"') {
              $languageName = $Matches[1]
              $languageFile = Join-Path $compilerRoot ($Matches[2] -replace '/', '\\')
              if (-not (Test-Path $languageFile)) {
                [void]$unavailableLanguages.Add($languageName)
                Write-Host "Skipping unavailable Inno Setup language '$languageName': $languageFile"
                continue
              }
              $keptLanguages++
            }

            if ($inCustomMessages -and $line -match '^\s*([A-Za-z0-9_]+)\.' -and $unavailableLanguages.Contains($Matches[1])) {
              Write-Host "Skipping custom messages for unavailable language '$($Matches[1])'"
              continue
            }
            $line
          }
          if ($keptLanguages -lt 1) { throw 'No usable Inno Setup language definitions remain.' }
          $script = $filteredLines -join "`r`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $scriptPath), $script, [System.Text.UTF8Encoding]::new($false))

          & $iscc $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $installer = Get-ChildItem -Path . -Filter 'StremioSetup-v*_x64.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Native MPV installer was not produced at the expected output path.' }
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $signature = [System.IO.File]::ReadAllBytes($installer.FullName)[0..1]
          if ($signature[0] -ne 0x4D -or $signature[1] -ne 0x5A) { throw 'Installer does not have a valid Windows PE signature.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Run native shell tests
        working-directory: native-shell
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Upload native MPV installer
        uses: actions/upload-artifact@v4
        with:
          name: Stremio-Cinema-Native-Windows-x64
          path: native-shell/StremioSetup*.exe
          if-no-files-found: error
          retention-days: 14
